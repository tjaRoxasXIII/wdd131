<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Week 05 Product Review Form Assignment Page which allows form submissions and runs javascript to track submission counts">
    <meta name="author" content="Taylor Allen">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <title>Product Review</title>
</head>
<body>
    <header>

    </header>
    <main>
        <legend>Product Review</legend>
        <form method="get" action="review.html" class="review">
        <fieldset>
            <label>Product Name*
                <select name="pname" id="pname" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </label>
            <label>Overall Rating*</label>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>

            <label>Date of Installation<input type="date" id="instdate" name="instdate"></label>
            <label>Which features did you find useful in the product? (Check all that apply)</label>
            <div class="features">
                <label><input type="checkbox" name="durability" value="yes">Durability</label>
                <label><input type="checkbox" name="ease" value="yes">Ease of Use</label>
                <label><input type="checkbox" name="performance" value="yes">Performance</label>
                <label><input type="checkbox" name="design" value="yes">Design</label>
            </div>
            <label>Written Review (optional)<textarea id="review" name="review"></textarea></label>
            <label>Your Name (optional)<input type="text" id="uname" name="uname"></label>

            <input type="submit" value="Post Review">
            <div class="counter" id="reviewCounter"></div>

        </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> - Taylor Allen - Florida</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
