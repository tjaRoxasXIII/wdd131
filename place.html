<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Week 03 Country Page Assignment depicting information about Japan">
    <meta name="author" content="Taylor Allen">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <title>Japan</title>
</head>
<body>
    <header>
        <h1>Japan</h1>
    </header>
    <main>
        <picture>
            <source srcset="images/japan-hero-small.webp" media="(max-width: 500px)">
            <img src="images/japan-hero-large.webp" alt="Red and black Japanese arches covering a cobblestone path">
        </picture>
        <section class="data">
            <h3>Data</h3>
            <ul>
                <li><strong>Area:</strong> 377,975 sq km</li>
                <li><strong>Population:</strong> 124 (mil)</li>
                <li><strong>Capital:</strong> Tokyo</li>
                <li><strong>Languages:</strong> Japanese</li>
                <li><strong>Currency:</strong> Yen</li>
                <li><strong>Time Zone:</strong> UTC+09:00</li>
                <li><strong>Calling Code:</strong> +81</li>
                <li><strong>Internet TLD:</strong> .jp</li>
            </ul>

        </section>
        <section class="weather">
            <h3>Weather</h3>
            <picture class="icon">
                <img src="images/weather-icon.svg" alt="Weather icon of a sun behind a cloud">
            </picture>
            <ul>
                <li><strong>Temperature:</strong> 16  &deg;C</li>
                <li><strong>Conditions:</strong> Cloudy</li>
                <li><strong>Wind:</strong> 6 km/h</li>
                <li id="windchill"></li>
            </ul>
        </section>
        <footer>
            <p>&copy; <span id="currentyear"></span> - Taylor Allen - Florida</p>
            <p id="lastModified"></p>
        </footer>
    </main>
    
</body>
</html>
