<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple HTML Table example for week 04 learning assignments">
    <meta name="author" content="Taylor Allen">
    <title>HTML Table</title>
    <link rel="stylesheet" href="styles/html-tables.css">
</head>
<body>
    <table>
        <caption>ACME Wildwest Services</caption>
        <thead>
            <tr>
                <th class="blank"></th>
                <th>Basic</th>
                <th>Premium</th>
                <th>Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Feature 1</td>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <td>Feature 2</td>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <td>Feature 3</td>
                <td>❌</td>
                <td>❌</td>
                <td>✔️</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Table 1: Account Feature Comparison</td>
            </tr>
        </tfoot>
</body>
</html>
